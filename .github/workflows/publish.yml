name: Publish

# Publishes uprime-piv with PyPI Trusted Publishing (OIDC). No API token or
# secret is used: PyPI trusts this repository, this workflow file
# (publish.yml) and the "pypi" environment, as registered on pypi.org.
#
# Publishing a GitHub release is the only trigger. The upload waits in the
# "pypi" environment, which requires a reviewer's approval.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The package version comes from uprime/version.txt, not from the tag.
      # A release tagged without bumping version.txt would build fine and fail
      # only at upload, because PyPI never accepts the same version twice, so
      # fail here instead.
      #
      # This is a plain string comparison and assumes tags like "v0.9.1". A
      # prerelease tag such as "v0.8.0-alpha" would fail it even when correct,
      # since version.txt would hold the PEP 440 form (e.g. "0.8.0a0"). Revisit
      # before tagging a prerelease.
      #
      # GITHUB_REF_NAME is the tag name on a release event (GITHUB_REF is
      # refs/tags/<tag>). It is read from the environment rather than
      # interpolated with ${{ }}, so a tag name cannot inject shell code.
      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(tr -d '[:space:]' < uprime/version.txt)"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match uprime/version.txt ($PKG). Bump version.txt before releasing."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build the sdist and wheel
        run: python -m build

      - name: Check the distributions
        run: python -m twine check dist/*

      - name: Store the distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/uprime-piv
    permissions:
      id-token: write  # mandatory for Trusted Publishing; set on this job only

    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish the distributions
        uses: pypa/gh-action-pypi-publish@release/v1
