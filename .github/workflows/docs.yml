# This file was created automatically with `myst init --gh-pages` 🪄 💚
# Ensure your GitHub Pages settings for this repository are set to deploy with **GitHub Actions**.

name: MyST GitHub Pages Deploy
on:
  push:
    # Runs on pushes targeting the default branch
    branches: [main]
env:
  # `BASE_URL` determines, relative to the root of the domain, the URL that your site is served from.
  # E.g., if your site lives at `https://mydomain.org/myproject`, set `BASE_URL=/myproject`.
  # If, instead, your site lives at the root of the domain, at `https://mydomain.org`, set `BASE_URL=''`.
  # The MyST manual is served under /manual/; the hand-written landing page
  # (index.html) sits at the project root.
  BASE_URL: /${{ github.event.repository.name }}/manual

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install MyST
        run: npm install -g mystmd
      - name: Build HTML Assets
        working-directory: docs/manual
        run: myst build --html
      # Assemble the site: the landing page and the files it references at the
      # root, the search-engine verification files (removing them breaks the
      # Google and Bing site-ownership checks), and the manual under /manual/.
      - name: Assemble site
        run: |
          mkdir -p _site/manual
          cp index.html _site/
          cp BingSiteAuth.xml google16b4f134179582fc.html _site/
          mkdir -p _site/docs/images _site/uprime/assets
          cp docs/Manual.pdf _site/docs/
          cp docs/images/gui_v08.png _site/docs/images/
          cp uprime/assets/logo_dark.png _site/uprime/assets/
          cp -r docs/manual/_build/html/* _site/manual/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
